<style>
  @font-face {

  :root {
    --paper: #F3F2EE;
    --ink: #141413;
    --muted: #5E5D58;
    --rule: #D6D4CD;
    --accent: #C4321A;
    --glow: rgba(255, 190, 110, 0);
    --x: 50%;

  }
  :root[data-theme="dark"] {
    --paper: #0F0F0E;
    --ink: #ECE9E2;
    --muted: #A6A299;
    --rule: #2C2B28;
    --accent: #F0A04B;
    --glow: rgba(255, 190, 110, 0.09);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    background-color: var(--paper);
    background-image: radial-gradient(600px circle at var(--x) var(--y), var(--glow), transparent 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 20px;
    line-height: 1.6;
    transition: background-color .6s ease, color .6s ease;

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 1.5px;

  a:hover { text-decoration-thickness: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 40px 72px; }

  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 32px; }

    display: flex; align-items: flex-start; gap: 10px;

  }
  .switch span { padding-top: 12px; }
  .switch svg { overflow: visible; }
  .switch .chain { transition: transform .16s ease; }
  .switch.tug .chain { transform: translateY(7px); }
  .switch circle { fill: var(--accent); transition: fill .6s ease; }

  /* Name */
  .intro { padding: 88px 0 72px; }
  h1 {
    margin: 0;

  }
  .role { margin-top: 20px; font-size: clamp(20px, 2vw, 24px); color: var(--muted); }

  /* Sections */
  .row {

    padding: 24px 0 40px;
    transition: opacity .5s ease, border-color .6s ease;
  }
  .row.lead { border-top: 1.5px solid var(--ink); padding: 28px 0 48px; gap: 24px 48px; }

  .row p { flex: 999 1 560px; min-width: 0; max-width: 720px; margin: 0; }

<div class="wrap">
  <header class="top fade">
    <nav aria-label="Site">
      <a href="/">Home</a>
      <a href="/press/">Press</a>
    </nav>
    <button class="switch" type="button" aria-pressed="false" id="lights">
      <span>Lights off</span>
      <svg width="12" height="44" viewBox="0 0 12 44" aria-hidden="true">
        <g class="chain">
          <line x1="6" y1="0" x2="6" y2="31" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 2.2"/>
          <circle cx="6" cy="36" r="4.4"/>
        </g>
      </svg>
    </button>
  </header>
  <div class="intro fade">
    <h1>Page not<br>found</h1>
    <div class="role">Independent coverage, podcasts and features</div>
  </div>
  <main class="bio"><section class="row"><h2>404</h2><p>That page does not exist. <a href="/">Back to the home page</a>.</p></section></main>
  <footer>Updated October 2026</footer>
</div>
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('lights');
    var label = btn.querySelector('span');
    var meta = document.querySelector('meta[name="theme-color"]');

    function render() {
      var dark = root.dataset.theme === 'dark';
      label.textContent = dark ? 'Lights on' : 'Lights off';
      btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      meta.setAttribute('content', dark ? '#0F0F0E' : '#F3F2EE');
    }

    btn.addEventListener('click', function () {
      var dark = root.dataset.theme !== 'dark';
      if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme;
      try { localStorage.setItem('lights', dark ? 'off' : 'on'); } catch (e) {}
      btn.classList.add('tug');
      setTimeout(function () { btn.classList.remove('tug'); }, 170);
      render();
    });

    // Lamp glow follows the cursor (only visible with the lights off).
    var pending = false, mx = 0, my = 0;
    window.addEventListener('pointermove', function (e) {
      mx = e.clientX; my = e.clientY;
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        root.style.setProperty('--x', mx + 'px');
        root.style.setProperty('--y', my + 'px');
        pending = false;
      });
    }, { passive: true });

    render();
  })();
</script>
</body>
